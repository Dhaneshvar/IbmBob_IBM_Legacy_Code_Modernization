[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lm-modernizer"
version = "0.1.0"
description = "Deterministic COBOL/JCL -> IR -> agentic migration pipeline"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
]

[project.optional-dependencies]
antlr = ["antlr4-python3-runtime>=4.13"]
graph = ["neo4j>=5.0"]
llm = ["anthropic>=0.40"]
groq = ["groq>=0.11"]
openai = ["openai>=1.0"]
serve = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
]
all = [
    "antlr4-python3-runtime>=4.13",
    "neo4j>=5.0",
    "anthropic>=0.40",
    "groq>=0.11",
    "openai>=1.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
]

[project.scripts]
lm = "lm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
